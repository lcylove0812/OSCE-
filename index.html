<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ed4453"><title>OSCE 站位計時器</title><style>
:root{color-scheme:light;--ink:#23334a;--red:#ed4453;--yellow:#ffda44;--blue:#326ab5}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#f6f5e9;font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;background-image:radial-gradient(#d9dfc9 1.4px,transparent 1.4px);background-size:20px 20px}header{display:flex;align-items:center;justify-content:space-between;max-width:1000px;margin:auto;padding:24px;gap:10px}.brand{font-weight:900;font-size:15px;display:flex;align-items:center;gap:10px}.mini-ball{width:27px;height:27px;border:3px solid var(--ink);border-radius:50%;background:linear-gradient(var(--red) 44%,var(--ink) 44%,var(--ink) 57%,white 57%);position:relative;transform:rotate(-20deg)}.mini-ball:after{content:'';position:absolute;width:10px;height:10px;border:2px solid var(--ink);background:white;border-radius:50%;left:5.5px;top:5.5px}.pill{background:white;border:2px solid var(--ink);padding:7px 11px;border-radius:20px;font-size:10px;font-weight:700;box-shadow:2px 2px 0 var(--ink)}main{max-width:780px;margin:12px auto;padding:0 24px}.eyebrow{display:inline-block;background:var(--yellow);font-size:11px;letter-spacing:.1em;font-weight:850;border:2px solid var(--ink);border-radius:5px;padding:5px 9px;transform:rotate(-2deg)}h1{font-size:clamp(30px,6vw,46px);font-weight:950;letter-spacing:-.035em;margin:14px 0 6px;color:var(--blue);text-shadow:2px 2px 0 #fff}main>p{font-size:13px;color:#64718a;line-height:1.8}.station{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin:20px 0}.station label{background:#fff;border:2px solid var(--ink);padding:12px 15px;border-radius:12px;box-shadow:3px 3px 0 #c4c8b5;color:#6b768b;font-size:11px;font-weight:700}.station input{display:block;width:100%;font:800 17px system-ui;color:var(--ink);border:0;background:transparent;margin-top:5px;padding:0;height:30px;outline-offset:4px}.timer{position:relative;border:3px solid var(--ink);border-radius:22px;background:#fff;padding:20px 24px 26px;text-align:center;box-shadow:6px 7px 0 #23334a;overflow:hidden}.timer:after{content:'✦';position:absolute;top:66px;right:27px;color:#ffda44;font-size:44px;transform:rotate(10deg)}.top{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#69778e;gap:8px}.top>span:first-child{font-weight:800;color:var(--blue);background:#ecf3ff;border:1px solid #d4e0f6;border-radius:30px;padding:7px 10px}.dot{display:inline-block;width:7px;height:7px;background:var(--blue);border-radius:50%;margin-right:7px}.dial{position:relative;width:min(320px,100%);aspect-ratio:1;margin:12px auto 16px;display:flex;align-items:center;justify-content:center;flex-direction:column;isolation:isolate}.dial:before{content:'';position:absolute;inset:27px;border:5px solid var(--ink);border-radius:50%;background:linear-gradient(var(--red) 0 46%,var(--ink) 46% 53%,#f4f7fc 53%);box-shadow:inset -10px -10px 0 #0000000d,0 7px 0 #23334a15;z-index:-2;transform:rotate(-12deg)}.dial:after{content:'';position:absolute;inset:13px;border:1px dashed #c6d2e4;border-radius:50%;z-index:-3}.dial svg{position:absolute;width:100%;height:100%;inset:0;transform:rotate(-90deg);pointer-events:none;overflow:visible}.ring-base{fill:none;stroke:#e7edf5;stroke-width:10}.ring-progress{fill:none;stroke:var(--blue);stroke-width:10;stroke-linecap:round;stroke-dasharray:879.646;stroke-dashoffset:0}.dial-label{color:#fff;font-size:12px;letter-spacing:.15em;font-weight:800;margin-bottom:14px;text-shadow:0 1px 2px #831c30}.clock{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:900;font-size:clamp(58px,16vw,76px);line-height:1.15;letter-spacing:-.07em;background:white;border:4px solid var(--ink);border-radius:15px;padding:5px 17px 6px;box-shadow:0 5px 0 #23334a17;color:var(--ink)}.dial-foot{margin-top:14px;font-size:10px;letter-spacing:.09em;color:#5e6b80;font-weight:750}.status{font-size:14px;font-weight:700;min-height:24px;color:#64718a}.track{height:11px;max-width:380px;margin:14px auto 20px;border:2px solid var(--ink);border-radius:20px;background:#edf1f6;overflow:hidden}.bar{height:100%;width:100%;background:#63c487;border-radius:20px}.controls{display:flex;gap:12px;max-width:440px;margin:auto}button{font:800 15px system-ui;cursor:pointer;border:2px solid var(--ink);border-radius:10px;min-height:51px;padding:12px 18px;box-shadow:0 4px 0 var(--ink);transition:transform .12s,box-shadow .12s}button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}button:focus-visible,input:focus-visible{outline:3px solid #367cc9;outline-offset:4px}.primary{flex:2;background:var(--yellow);color:var(--ink)}.secondary{flex:1;background:#edf3fc;color:var(--ink)}.settings{margin-top:24px;padding:19px;background:#e8effa;border:2px solid var(--ink);border-radius:15px;box-shadow:3px 4px 0 #c4cde0}.settings-title{font-weight:900;font-size:14px;color:var(--blue)}.settings-title span{display:block;font-size:11px;color:#667892;font-weight:500;margin-top:5px}.settings-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}.settings-fields label{font-size:12px;color:#52637d;font-weight:750}.settings-fields input{display:block;width:100%;height:48px;border:2px solid #b7c7de;border-radius:8px;background:#fff;color:var(--blue);font:800 23px ui-monospace,monospace;padding:9px 12px;margin-top:7px}.textbtn{min-height:40px;padding:9px 12px;font-size:12px;background:white;box-shadow:0 2px 0 var(--ink)}.settings p{font-size:11px;color:#60728c;line-height:1.7;margin-bottom:0}button:disabled,input:disabled{opacity:.5;cursor:not-allowed}.options{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 0}.options>div{display:flex;gap:8px}.switch{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:700}input[type=checkbox]{width:18px;height:18px;accent-color:var(--red)}.note{font-size:11px;text-align:center;color:#7b8495;line-height:1.8;margin:18px 0}footer{text-align:center;font-size:10px;color:#85909d;margin:26px 0}.author-version{display:inline-block;background:#fff;border:2px solid var(--ink);border-radius:20px;padding:7px 18px;box-shadow:2px 2px 0 #c4c8b5;font-size:12px;color:var(--ink);font-weight:800;letter-spacing:.04em;margin-bottom:12px}.warning .ring-progress{stroke:#ffae21}.warning .clock{color:#9d5b00;background:#fff8de;border-color:#c88113}.warning .status{color:#a76300}.warning .bar{background:#ffc144}.warning .timer{border-color:#c88113}.ended .timer{background:#fff0f1;border-color:#d62940;box-shadow:6px 7px 0 #a92a3e}.ended .ring-progress{stroke:#ed4453}.ended .clock{color:#d62940;border-color:#d62940}.ended .status{color:#d62940}.ended .primary{background:#ed4453;color:#fff}.ended .bar{background:var(--red)}@media(max-width:520px){header{padding:18px 16px}.brand{font-size:12px}.pill{font-size:9px;padding:6px 8px}main{padding:0 16px;margin:10px auto}h1{font-size:32px}.station{grid-template-columns:1fr;gap:9px;margin:17px 0}.station label{padding:10px 13px}.station input{font-size:16px;height:26px}.timer{padding:15px 14px 22px;border-radius:18px;box-shadow:4px 5px 0 var(--ink)}.dial{width:280px;margin:10px auto 12px}.clock{font-size:66px;padding:4px 13px}.dial-label{margin-bottom:12px;font-size:11px}.dial-foot{font-size:9px;margin-top:12px}.timer:after{right:12px;top:53px;font-size:29px}.controls button{padding:12px 10px}.settings{padding:15px}.options{gap:7px}.textbtn{font-size:11px;padding:8px}.note{font-size:10px}}@media(max-width:350px){.dial{width:240px}.clock{font-size:56px}.dial-label{font-size:10px;margin-bottom:8px}.dial-foot{font-size:8px;margin-top:8px}.pill{display:none}.options{flex-wrap:wrap}}@media(prefers-reduced-motion:no-preference){.bar{transition:width .2s linear}.ring-progress{transition:stroke-dashoffset .2s linear}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header><div class="brand"><span class="mini-ball" aria-hidden="true"></span>OSCE 站位計時器</div><span class="pill">臨床技能測驗 · 站位計時</span></header><main><div class="eyebrow">考官訓練家 · 準備挑戰</div><h1>OSCE 站位計時器</h1><p id="summary">8 分鐘站位倒數，最後 1 分鐘自動提醒。</p><div class="station"><label>站位與項目<input id="station" type="text" value="第 3 站 腹部身體檢查" aria-label="站位與項目"></label><label>學員<input id="student" type="text" value="學員 A" aria-label="學員"></label></div><section class="timer" aria-label="站位倒數計時器"><div class="top"><span><i class="dot"></i><span id="phase">準備就緒</span></span><span id="durationLabel">每站 8 分鐘</span></div><div class="dial"><svg viewBox="0 0 320 320" aria-hidden="true"><circle class="ring-base" cx="160" cy="160" r="140"/><circle class="ring-progress" id="ring" cx="160" cy="160" r="140"/></svg><span class="dial-label">本站剩餘時間</span><div class="clock" id="clock" role="timer" aria-label="剩餘時間">08:00</div><span class="dial-foot">每一站，都是新的挑戰</span></div><div class="status" id="status" role="status" aria-live="polite">準備好了，就開始這一站</div><div class="track"><div class="bar" id="bar"></div></div><div class="controls"><button class="primary" id="start">▶ 開始計時</button><button class="secondary" id="reset">↻ 重設</button></div></section><section class="settings" aria-label="時間設定"><div class="settings-title">⚡ 時間設定 <span>可輸入 0.5，代表 30 秒</span></div><div class="settings-fields"><label>每站時間（分鐘）<input id="duration" type="number" min="0.5" max="120" step="0.5" value="8" inputmode="decimal"></label><label>剩餘提醒（分鐘）<input id="reminder" type="number" min="0" max="119.5" step="0.5" value="1" inputmode="decimal"></label></div><button id="apply" class="textbtn">套用設定並重設</button><p id="settingsNote" role="status">提醒設為 0 可關閉提前響鈴；計時中請先暫停再修改。</p></section><div class="options"><label class="switch"><input type="checkbox" id="sound" checked>提示音效</label><div><button class="textbtn" id="test">♫ 測試音效</button><button class="textbtn" id="fullscreen">⛶ 全螢幕</button></div></div><p class="note" id="note">使用時請保持網頁開啟、手機螢幕亮起，並確認媒體音量。<br>各裝置獨立計時，不會互相同步。</p><footer><div class="author-version">劉淳儀_V01版</div><div>客觀結構式臨床技能測驗</div></footer></main><script>
const $=id=>document.getElementById(id);let TOTAL=480000,reminderMs=60000;let remaining=TOTAL,deadline=0,running=false,warned=false,ctx,wake;
function audio(){try{ctx??=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}catch{}}
function beep(end=false){if(!$('sound').checked)return;audio();if(!ctx)return;for(let i=0;i<(end?3:2);i++){const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.38;o.type='sine';o.frequency.value=end?660:880;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.23,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.27);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.3)}}
async function keepAwake(){try{if('wakeLock'in navigator)wake=await navigator.wakeLock.request('screen')}catch{}}
function release(){wake?.release().catch(()=>{});wake=null}
function draw(){$('duration').disabled=running;$('reminder').disabled=running;$('apply').disabled=running;const secs=Math.ceil(remaining/1000);$('clock').textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');document.title=$('clock').textContent+' · OSCE 計時器';$('bar').style.width=remaining/TOTAL*100+'%';$('ring').style.strokeDashoffset=879.646*(1-remaining/TOTAL);document.body.className=remaining===0?'ended':reminderMs>0&&remaining<=reminderMs?'warning':'';$('start').textContent=running?'Ⅱ 暫停':remaining===0?'▶ 再次開始':remaining<TOTAL?'▶ 繼續計時':'▶ 開始計時';$('phase').textContent=remaining===0?'本站結束':running?'計時進行中':remaining<TOTAL?'已暫停':'準備就緒'}
function tick(){if(!running)return;remaining=Math.max(0,deadline-Date.now());if(remaining===0){running=false;beep(true);$('status').textContent='時間到，本站結束';release()}else if(reminderMs>0&&remaining<=reminderMs&&!warned){warned=true;beep();$('status').textContent='剩下 '+(reminderMs/60000)+' 分鐘，請掌握時間'}draw()}
$('start').onclick=()=>{audio();if(running){tick();if(!running)return;running=false;release();$('status').textContent='已暫停，準備好後繼續'}else{if(remaining===0){remaining=TOTAL;warned=false}deadline=Date.now()+remaining;running=true;keepAwake();$('status').textContent=reminderMs>0&&remaining<=reminderMs?'剩下 '+(reminderMs/60000)+' 分鐘，請掌握時間':'本站進行中，專注完成任務'}draw()};$('reset').onclick=()=>{running=false;remaining=TOTAL;warned=false;release();$('status').textContent='準備好了，就開始這一站';draw()};$('test').onclick=()=>{audio();beep()};$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{$('note').textContent='此瀏覽器不支援全螢幕，可將手機橫放或加入主畫面使用。'}};document.addEventListener('visibilitychange',()=>{if(!document.hidden&&running){tick();keepAwake()}});$('apply').onclick=()=>{if(running)return;const minutes=Number($('duration').value),reminder=Number($('reminder').value);if(!$('duration').value.trim()||!$('reminder').value.trim()||!Number.isFinite(minutes)||minutes<0.5||minutes>120||minutes*2%1!==0||!Number.isFinite(reminder)||reminder<0||reminder>=minutes||reminder*2%1!==0){$('settingsNote').textContent='請輸入 0.5～120 分鐘（每次 0.5 分鐘）；提醒須小於每站時間，或設為 0 關閉。';return}TOTAL=minutes*60000;reminderMs=reminder*60000;remaining=TOTAL;warned=false;release();$('durationLabel').textContent='每站 '+minutes+' 分鐘';$('summary').textContent=minutes+' 分鐘站位倒數'+(reminder>0?'，剩 '+reminder+' 分鐘自動提醒。':'，時間到自動提醒。');$('settingsNote').textContent='已套用：每站 '+minutes+' 分鐘，'+(reminder>0?'剩 '+reminder+' 分鐘提醒。':'關閉提前提醒。');$('status').textContent='設定已套用，準備好了就開始';draw()};setInterval(tick,100);draw();
</script></body></html>
